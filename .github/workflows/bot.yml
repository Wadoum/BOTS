name: Telegram DeepSeek Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache modèle
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-deepseek-7b-sandlogic

      - name: Installer dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          pip install -r requirements.txt

      - name: Vérifier le fichier GGUF
        run: |
          python -c "
          import os
          from huggingface_hub import hf_hub_download
          path = hf_hub_download('SandLogicTechnologies/DeepSeek-R1-Distill-Qwen-7B-GGUF', 'DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf')
          size = os.path.getsize(path) / 1024**3
          print(f'Taille: {size:.2f} GB')
          with open(path, 'rb') as f:
              magic = f.read(4)
          print(f'Magic: {magic}')
          assert magic == b'GGUF', 'Magic bytes invalides'
          "

      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot.py
