name: APK Patcher

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL de l'APK source"
        required: true
        type: string
      user_id:
        description: "ID Telegram"
        required: true
        type: string
      file_name:
        description: "Nom du fichier"
        required: true
        type: string
      chat_id:
        description: "ID de chat Telegram"
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl
          pip install -r requirements.txt

      - name: Répertoires
        run: mkdir -p data/input data/output data/logs tools

      - name: Télécharger ReVanced CLI + Patches
        run: |
          set -e
          echo "→ ReVanced CLI"
          REVANCED_CLI_URL=$(curl -sSL https://api.github.com/repos/ReVanced/revanced-cli/releases/latest \
            | grep "browser_download_url.*\.jar" | head -1 | cut -d'"' -f4)
          echo "URL CLI: $REVANCED_CLI_URL"
          curl -fsSL -o tools/revanced-cli.jar "$REVANCED_CLI_URL"

          echo "→ ReVanced Patches"
          REVANCED_PATCHES_URL=$(curl -sSL https://api.github.com/repos/ReVanced/revanced-patches/releases/latest \
            | grep "browser_download_url.*\.jar\|browser_download_url.*\.mpp" | head -1 | cut -d'"' -f4)
          echo "URL patches: $REVANCED_PATCHES_URL"
          curl -fsSL -o tools/patches.jar "$REVANCED_PATCHES_URL"

          echo "→ uber-apk-signer"
          curl -fsSL -o tools/uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"

          ls -lh tools/

      - name: Télécharger l'APK
        run: |
          curl -fL --retry 3 -o data/input/original.apk "${{ github.event.inputs.file_url }}"
          ls -lh data/input/

      - name: Analyser l'APK
        run: |
          python modules/apk_analyzer.py data/input/original.apk --pretty | tee data/logs/analyze.log || true

      - name: Patcher avec ReVanced
        id: revanced
        continue-on-error: true
        run: |
          java -jar tools/revanced-cli.jar patch \
            --patches tools/patches.jar \
            --out data/output/patched.apk \
            --exclusive \
            data/input/original.apk 2>&1 | tee data/logs/revanced.log || true

          if [ -s data/output/patched.apk ]; then
            echo "revanced_ok=true" >> $GITHUB_OUTPUT
            ls -lh data/output/patched.apk
          else
            echo "revanced_ok=false" >> $GITHUB_OUTPUT
            echo "ReVanced n'a pas pu patcher cet APK (normal si non supporté)"
          fi

      - name: Fallback (copie brute)
        if: steps.revanced.outputs.revanced_ok != 'true'
        run: |
          echo "ReVanced incompatible → copie de l'APK original pour signature"
          cp data/input/original.apk data/output/patched.apk

      - name: Signature
        run: |
          java -jar tools/uber-apk-signer.jar \
            --apks data/output/patched.apk \
            --out data/output/ \
            --overwrite 2>&1 | tee data/logs/sign.log
          ls -lh data/output/

      - name: Envoi Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          FILE_NAME: ${{ github.event.inputs.file_name }}
        run: |
          set -e
          SIGNED=$(find data/output -name "*-signed.apk" -o -name "*-aligned-signed.apk" | head -1)
          if [ -z "$SIGNED" ]; then
            echo "Fichiers présents :"
            ls -la data/output/
            echo "::error::Aucun APK signé trouvé"
            exit 1
          fi
          SIZE=$(stat -c %s "$SIGNED")
          echo "Envoi : $SIGNED ($SIZE octets)"
          curl -sS -F "chat_id=$CHAT_ID" \
            -F "caption=APK patché : ${FILE_NAME}" \
            -F "document=@${SIGNED};filename=patched_${FILE_NAME}" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" \
            | tee data/logs/telegram.log

      - name: Notification échec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          curl -sS -F "chat_id=$CHAT_ID" \
            -F "text=❌ Échec du patch. Logs : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" || true

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 7
