name: APK Patcher 64-bit

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL de téléchargement de l'APK source"
        required: true
        type: string
      user_id:
        description: "Identifiant Telegram du demandeur"
        required: true
        type: string
      file_name:
        description: "Nom original du fichier APK"
        required: true
        type: string
      chat_id:
        description: "Identifiant de la conversation Telegram"
        required: true
        type: string
      arch:
        description: "Architecture cible"
        required: false
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

concurrency:
  group: apk-patcher-${{ github.event.inputs.user_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  JAVA_TOOL_OPTIONS: "-Xmx2g"
  MORPHE_JAR: "tools/morphe-cli.jar"
  APKEDITOR_JAR: "tools/APKEditor.jar"
  SIGNER_JAR: "tools/uber-apk-signer.jar"
  WORK_DIR: "${{ github.workspace }}/data"

jobs:
  patch:
    name: Patch et compilation APK
    runs-on: self-hosted
    timeout-minutes: 350
    continue-on-error: false

    steps:
      - name: Vérification des entrées
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          FILE_URL="${{ github.event.inputs.file_url }}"
          USER_ID="${{ github.event.inputs.user_id }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          FILE_NAME="${{ github.event.inputs.file_name }}"
          ARCH="${{ github.event.inputs.arch }}"

          if [ -z "${FILE_URL}" ] || [ -z "${USER_ID}" ] || [ -z "${CHAT_ID}" ] || [ -z "${FILE_NAME}" ]; then
            echo "::error::Paramètres d'entrée incomplets"
            exit 1
          fi

          case "${FILE_URL}" in
            https://*|http://*) ;;
            *)
              echo "::error::URL invalide : doit commencer par http(s)://"
              exit 1
              ;;
          esac

          case "${ARCH}" in
            arm64-v8a|armeabi-v7a|x86_64) ;;
            *)
              echo "::error::Architecture non supportée : ${ARCH}"
              exit 1
              ;;
          esac

          if [ -z "${TELEGRAM_TOKEN:-}" ]; then
            echo "::error::Secret TELEGRAM_TOKEN manquant"
            exit 1
          fi

          SAFE_NAME=$(printf '%s' "${FILE_NAME}" | tr -cd 'A-Za-z0-9._-')
          if [ -z "${SAFE_NAME}" ]; then
            SAFE_NAME="application.apk"
          fi

          echo "safe_name=${SAFE_NAME}" >> "$GITHUB_OUTPUT"
          echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Préparation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Préparation de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Création des répertoires de travail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_DIR}/input" "${WORK_DIR}/output" "${WORK_DIR}/logs" tools
          chmod 700 "${WORK_DIR}"
          chmod 700 "${WORK_DIR}/input" "${WORK_DIR}/output" "${WORK_DIR}/logs"

      - name: Téléchargement des outils
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          download() {
            url="$1"; dest="$2"
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 4 --connect-timeout 15 --max-time 600 -o "${dest}.tmp" "${url}"; then
                mv "${dest}.tmp" "${dest}"
                return 0
              fi
              echo "::warning::Tentative ${attempt} échouée pour ${url}"
              sleep $((attempt * 5))
            done
            return 1
          }

          if [ ! -s "${MORPHE_JAR}" ]; then
            download "https://github.com/MorpheApp/morphe-cli/releases/latest/download/morphe-cli.jar" "${MORPHE_JAR}" || {
              echo "::error::Échec du téléchargement de Morphe CLI"
              exit 1
            }
          fi

          if [ ! -s "${APKEDITOR_JAR}" ]; then
            download "https://github.com/REAndroid/APKEditor/releases/latest/download/APKEditor.jar" "${APKEDITOR_JAR}" || {
              echo "::error::Échec du téléchargement d'APKEditor"
              exit 1
            }
          fi

          if [ ! -s "${SIGNER_JAR}" ]; then
            download "https://github.com/patrickfav/uber-apk-signer/releases/latest/download/uber-apk-signer.jar" "${SIGNER_JAR}" || {
              echo "::error::Échec du téléchargement d'uber-apk-signer"
              exit 1
            }
          fi

          for jar in "${MORPHE_JAR}" "${APKEDITOR_JAR}" "${SIGNER_JAR}"; do
            if [ ! -s "${jar}" ]; then
              echo "::error::Outil manquant : ${jar}"
              exit 1
            fi
          done
          echo "tools=ok" >> "$GITHUB_OUTPUT"

      - name: Installation des dépendances Python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install "python-telegram-bot==21.6" "requests==2.32.3"
          fi

      - name: Téléchargement de l'APK source
        id: download
        shell: bash
        run: |
          set -euo pipefail
          APK="${WORK_DIR}/input/original.apk"
          URL="${{ github.event.inputs.file_url }}"

          for attempt in 1 2 3; do
            if curl -fL --retry 3 --retry-delay 4 --connect-timeout 20 --max-time 900 \
                    -A "APKPatcher/1.0" -o "${APK}" "${URL}"; then
              break
            fi
            echo "::warning::Tentative ${attempt} de téléchargement échouée"
            sleep $((attempt * 5))
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Impossible de télécharger l'APK source"
              exit 1
            fi
          done

          SIZE=$(stat -c %s "${APK}" 2>/dev/null || stat -f %z "${APK}")
          if [ "${SIZE}" -lt 1024 ]; then
            echo "::error::Fichier téléchargé trop petit (${SIZE} octets)"
            exit 1
          fi

          if ! head -c 4 "${APK}" | grep -q "PK"; then
            echo "::error::Le fichier téléchargé n'est pas un APK/ZIP valide"
            exit 1
          fi

          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

      - name: Analyse de l'APK
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          APK="${WORK_DIR}/input/original.apk"
          LOG="${WORK_DIR}/logs/analyze.log"
          python - "$APK" | tee "${LOG}"
        continue-on-error: false

      - name: Patch avec Morphe CLI
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          APK_IN="${WORK_DIR}/input/original.apk"
          APK_OUT="${WORK_DIR}/output/patched.apk"
          LOG="${WORK_DIR}/logs/patch.log"
          ARCH="${{ steps.validate.outputs.arch }}"

          java -jar "${MORPHE_JAR}" patch \
            --apk "${APK_IN}" \
            --out "${APK_OUT}" \
            --arch "${ARCH}" \
            --all 2>&1 | tee "${LOG}"

          if [ ! -s "${APK_OUT}" ]; then
            echo "::error::Le patch n'a produit aucun APK"
            exit 1
          fi

      - name: Compilation et extraction 64-bit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          APK_IN="${WORK_DIR}/output/patched.apk"
          APK_OUT="${WORK_DIR}/output/arm64.apk"
          LOG="${WORK_DIR}/logs/build.log"
          ARCH="${{ steps.validate.outputs.arch }}"

          python - "$APK_IN" "$APK_OUT" "$ARCH" | tee "${LOG}"

          if [ ! -s "${APK_OUT}" ]; then
            echo "::error::APK 64-bit manquant après compilation"
            exit 1
          fi

      - name: Signature de l'APK final
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          APK_IN="${WORK_DIR}/output/arm64.apk"
          OUT_DIR="${WORK_DIR}/output"
          LOG="${WORK_DIR}/logs/sign.log"

          java -jar "${SIGNER_JAR}" \
            --apks "${APK_IN}" \
            --out "${OUT_DIR}" \
            --overwrite 2>&1 | tee "${LOG}"

          SIGNED=$(find "${OUT_DIR}" -maxdepth 1 -type f -name "*-aligned-signed.apk" -o -name "*-signed.apk" | head -n 1)
          if [ -z "${SIGNED}" ]; then
            SIGNED=$(find "${OUT_DIR}" -maxdepth 1 -type f -name "*.apk" ! -name "arm64.apk" ! -name "patched.apk" | head -n 1)
          fi
          if [ -z "${SIGNED}" ] || [ ! -s "${SIGNED}" ]; then
            echo "::error::Aucun APK signé trouvé"
            exit 1
          fi

          echo "signed_path=${SIGNED}" >> "$GITHUB_OUTPUT"

      - name: Envoi du résultat sur Telegram
        if: success()
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          FILE_NAME: ${{ steps.validate.outputs.safe_name }}
          SIGNED_PATH: ${{ steps.sign.outputs.signed_path }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_TOKEN:-}" ]; then
            echo "::error::TELEGRAM_TOKEN manquant"
            exit 1
          fi
          if [ ! -s "${SIGNED_PATH}" ]; then
            echo "::error::Fichier signé introuvable : ${SIGNED_PATH}"
            exit 1
          fi

          SIZE=$(stat -c %s "${SIGNED_PATH}" 2>/dev/null || stat -f %z "${SIGNED_PATH}")
          MAX_SIZE=$((50 * 1024 * 1024))
          CAPTION="APK patché (${ARCH:-arm64}) - ${FILE_NAME}"

          if [ "${SIZE}" -gt "${MAX_SIZE}" ]; then
            URL=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 300 \
                  --upload-file "${SIGNED_PATH}" \
                  "https://transfer.sh/${FILE_NAME}")
            curl -fsS --connect-timeout 15 --max-time 60 \
              -F "chat_id=${CHAT_ID}" \
              -F "text=Fichier trop volumineux pour Telegram (${SIZE} octets). Lien : ${URL}" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" || true
          else
            curl -fsS --connect-timeout 20 --max-time 300 \
              -F "chat_id=${CHAT_ID}" \
              -F "caption=${CAPTION}" \
              -F "document=@${SIGNED_PATH};filename=patched_${FILE_NAME}" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" || {
                echo "::error::Échec d'envoi sur Telegram"
                exit 1
              }
          fi

      - name: Notification d'échec
        if: failure()
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -z "${TELEGRAM_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            exit 0
          fi
          MESSAGE="Échec du patch APK. Consulte les logs : ${RUN_URL}"
          curl -fsS --connect-timeout 15 --max-time 60 \
            -F "chat_id=${CHAT_ID}" \
            -F "text=${MESSAGE}" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" || true
          exit 0

      - name: Collecte des journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patcher-logs-${{ github.run_id }}
          path: data/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Nettoyage des fichiers temporaires
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "${WORK_DIR}/input" "${WORK_DIR}/output"
          mkdir -p "${WORK_DIR}/input" "${WORK_DIR}/output"
          exit 0
