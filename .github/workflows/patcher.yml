name: APK Patcher

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL de l'APK source"
        required: true
        type: string
      user_id:
        description: "ID Telegram"
        required: true
        type: string
      file_name:
        description: "Nom du fichier"
        required: true
        type: string
      chat_id:
        description: "ID de chat Telegram"
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl jq
          pip install -r requirements.txt

      - name: Répertoires
        run: mkdir -p data/input data/output data/logs tools

      - name: Télécharger ReVanced CLI (v6.0.0)
        run: |
          curl -fsSL -o tools/revanced-cli.jar \
            "https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar"
          ls -lh tools/revanced-cli.jar

      - name: Télécharger ReVanced Patches (.rvp)
        run: |
          # Récupère l'URL réelle depuis l'API ReVanced v5
          PATCHES_INFO=$(curl -sSL https://api.revanced.app/v5/patches)
          PATCH_URL=$(echo "$PATCHES_INFO" | jq -r '.download_url')
          PATCH_VERSION=$(echo "$PATCHES_INFO" | jq -r '.version')
          echo "Version patches: $PATCH_VERSION"
          echo "URL patches: $PATCH_URL"
          if [ -z "$PATCH_URL" ] || [ "$PATCH_URL" = "null" ]; then
            echo "::error::Impossible d'obtenir l'URL des patches"
            exit 1
          fi
          curl -fsSL -o tools/patches.rvp "$PATCH_URL"
          ls -lh tools/patches.rvp

      - name: Télécharger uber-apk-signer
        run: |
          curl -fsSL -o tools/uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          ls -lh tools/uber-apk-signer.jar

      - name: Télécharger l'APK
        run: |
          curl -fL --retry 3 -o data/input/original.apk "${{ github.event.inputs.file_url }}"
          ls -lh data/input/

      - name: Analyse APK
        run: |
          python modules/apk_analyzer.py data/input/original.apk --pretty | tee data/logs/analyze.log || true

      - name: Lister les patches compatibles
        id: list
        continue-on-error: true
        run: |
          java -jar tools/revanced-cli.jar list-patches \
            --patches tools/patches.rvp \
            --with-versions --with-packages 2>&1 | tee data/logs/patches-list.log | head -60

      - name: Patcher avec ReVanced
        id: revanced
        continue-on-error: true
        run: |
          java -jar tools/revanced-cli.jar patch \
            --patches tools/patches.rvp \
            --out data/output/patched.apk \
            data/input/original.apk 2>&1 | tee data/logs/revanced.log || true

          if [ -s data/output/patched.apk ]; then
            echo "revanced_ok=true" >> $GITHUB_OUTPUT
            ls -lh data/output/patched.apk
          else
            echo "revanced_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Fallback (copie brute si ReVanced échoue)
        if: steps.revanced.outputs.revanced_ok != 'true'
        run: |
          echo "ReVanced n'a pas pu patcher cet APK → copie brute"
          cp data/input/original.apk data/output/patched.apk

      - name: Signature
        run: |
          java -jar tools/uber-apk-signer.jar \
            --apks data/output/patched.apk \
            --out data/output/ \
            --overwrite 2>&1 | tee data/logs/sign.log
          ls -lh data/output/

      - name: Envoi Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          FILE_NAME: ${{ github.event.inputs.file_name }}
        run: |
          set -e
          SIGNED=$(find data/output -name "*-signed.apk" -o -name "*-aligned-signed.apk" | head -1)
          if [ -z "$SIGNED" ]; then
            echo "::error::Aucun APK signé"
            ls -la data/output/
            exit 1
          fi
          SIZE=$(stat -c %s "$SIGNED")
          MAX=$((50 * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX" ]; then
            URL=$(curl -sS --upload-file "$SIGNED" "https://transfer.sh/${FILE_NAME}")
            curl -sS -F "chat_id=$CHAT_ID" -F "text=Fichier trop gros : $URL" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
          else
            curl -sS -F "chat_id=$CHAT_ID" \
              -F "caption=APK patché : ${FILE_NAME}" \
              -F "document=@${SIGNED};filename=patched_${FILE_NAME}" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument"
          fi

      - name: Notification échec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          curl -sS -F "chat_id=$CHAT_ID" \
            -F "text=❌ Échec du patch. Logs : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 7
