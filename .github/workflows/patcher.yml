name: APK Patcher

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL de l'APK source"
        required: true
        type: string
      user_id:
        description: "ID Telegram"
        required: true
        type: string
      file_name:
        description: "Nom du fichier"
        required: true
        type: string
      chat_id:
        description: "ID de chat Telegram"
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl jq
          pip install -r requirements.txt

      - name: Préparer répertoires
        run: mkdir -p data/input data/output data/signed data/logs tools

      - name: Télécharger ReVanced CLI
        run: |
          curl -fsSL -o tools/revanced-cli.jar \
            "https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar"
          ls -lh tools/revanced-cli.jar

      - name: Télécharger ReVanced Patches (.rvp)
        run: |
          PATCHES_INFO=$(curl -sSL https://api.revanced.app/v5/patches)
          PATCH_URL=$(echo "$PATCHES_INFO" | jq -r '.download_url')
          echo "URL patches: $PATCH_URL"
          curl -fsSL -o tools/patches.rvp "$PATCH_URL"
          ls -lh tools/patches.rvp

      - name: Télécharger uber-apk-signer
        run: |
          curl -fsSL -o tools/uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          ls -lh tools/uber-apk-signer.jar

      - name: Télécharger l'APK
        run: |
          curl -fL --retry 3 -o data/input/original.apk "${{ github.event.inputs.file_url }}"
          ls -lh data/input/

      - name: Analyse APK
        run: python modules/apk_analyzer.py data/input/original.apk --pretty | tee data/logs/analyze.log || true

      - name: Patch ReVanced
        id: revanced
        continue-on-error: true
        run: |
          java -jar tools/revanced-cli.jar patch \
            --patches tools/patches.rvp \
            --out data/output/patched.apk \
            data/input/original.apk 2>&1 | tee data/logs/revanced.log || true
          if [ -s data/output/patched.apk ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Fallback copie
        if: steps.revanced.outputs.ok != 'true'
        run: cp data/input/original.apk data/output/patched.apk

      - name: Signature
        run: |
          echo "=== Input ==="
          ls -lh data/output/
          echo "=== Signature ==="
          java -jar tools/uber-apk-signer.jar \
            --apks data/output/patched.apk \
            --out data/signed/ \
            2>&1 | tee data/logs/sign.log
          echo "=== Output ==="
          ls -lh data/signed/ || echo "data/signed/ vide"

      - name: Localiser APK signé
        id: locate
        run: |
          SIGNED=$(find data/signed -type f -name "*.apk" | head -1)
          if [ -z "$SIGNED" ]; then
            echo "Pas d'APK signé, fallback copie"
            cp data/output/patched.apk data/signed/fallback.apk
            SIGNED="data/signed/fallback.apk"
          fi
          echo "signed_path=$SIGNED" >> $GITHUB_OUTPUT
          ls -lh "$SIGNED"

      - name: Envoi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          FILE_NAME: ${{ github.event.inputs.file_name }}
          SIGNED_PATH: ${{ steps.locate.outputs.signed_path }}
        run: |
          SIZE=$(stat -c %s "$SIGNED_PATH")
          echo "Envoi de $SIGNED_PATH ($SIZE octets)"
          curl -sS -F "chat_id=$CHAT_ID" \
            -F "caption=APK patché : ${FILE_NAME}" \
            -F "document=@${SIGNED_PATH};filename=patched_${FILE_NAME}" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" | tee data/logs/telegram.log

      - name: Notification échec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          curl -sS -F "chat_id=$CHAT_ID" \
            -F "text=❌ Échec. Logs : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 7
