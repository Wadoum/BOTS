name: APK Patcher 64-bit

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL de téléchargement de l'APK source"
        required: true
        type: string
      user_id:
        description: "Identifiant Telegram du demandeur"
        required: true
        type: string
      file_name:
        description: "Nom original du fichier APK"
        required: true
        type: string
      chat_id:
        description: "Identifiant de la conversation Telegram"
        required: true
        type: string
      arch:
        description: "Architecture cible"
        required: false
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

permissions:
  contents: read

jobs:
  patch:
    name: Patch et compilation APK
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake wget unzip curl

      - name: Installer dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Créer répertoires
        run: mkdir -p data/input data/output data/logs tools

      - name: Télécharger les outils (Morphe CLI, APKEditor, signer)
        run: |
          set -e
          curl -fsSL --retry 3 -o tools/morphe-cli.jar \
            "https://github.com/MorpheApp/morphe-cli/releases/latest/download/morphe-cli.jar" || true
          curl -fsSL --retry 3 -o tools/APKEditor.jar \
            "https://github.com/REAndroid/APKEditor/releases/latest/download/APKEditor.jar" || true
          curl -fsSL --retry 3 -o tools/uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/latest/download/uber-apk-signer.jar" || true
          ls -lh tools/

      - name: Télécharger l'APK
        run: |
          curl -fL --retry 3 -o data/input/original.apk "${{ github.event.inputs.file_url }}"
          ls -lh data/input/

      - name: Analyser l'APK
        run: python modules/apk_analyzer.py data/input/original.apk --pretty | tee data/logs/analyze.log

      - name: Patch avec Morphe CLI
        run: |
          java -jar tools/morphe-cli.jar patch \
            --apk data/input/original.apk \
            --out data/output/patched.apk \
            --arch "${{ github.event.inputs.arch }}" \
            --all 2>&1 | tee data/logs/patch.log || true
          ls -lh data/output/ || true

      - name: Compilation 64-bit
        run: |
          python modules/builder_64bit.py \
            data/output/patched.apk \
            data/output/arm64.apk \
            --arch "${{ github.event.inputs.arch }}" | tee data/logs/build.log || true
          ls -lh data/output/ || true

      - name: Signature APK
        run: |
          java -jar tools/uber-apk-signer.jar \
            --apks data/output/arm64.apk \
            --out data/output/ \
            --overwrite 2>&1 | tee data/logs/sign.log || true
          ls -lh data/output/ || true

      - name: Envoyer sur Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          FILE_NAME: ${{ github.event.inputs.file_name }}
        run: |
          SIGNED=$(find data/output -name "*-signed.apk" | head -1)
          if [ -z "$SIGNED" ]; then
            SIGNED=$(find data/output -name "*.apk" | head -1)
          fi
          if [ -z "$SIGNED" ]; then
            echo "Aucun APK trouvé"
            exit 1
          fi
          SIZE=$(stat -c %s "$SIGNED")
          MAX=$((50 * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX" ]; then
            URL=$(curl -sS --upload-file "$SIGNED" "https://transfer.sh/${FILE_NAME}")
            curl -sS -F "chat_id=$CHAT_ID" \
              -F "text=Fichier trop gros. Lien : $URL" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
          else
            curl -sS -F "chat_id=$CHAT_ID" \
              -F "caption=APK patché 64-bit : ${FILE_NAME}" \
              -F "document=@${SIGNED};filename=patched_${FILE_NAME}" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument"
          fi

      - name: Notification échec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          curl -sS -F "chat_id=$CHAT_ID" \
            -F "text=❌ Échec du patch. Consultez les logs du workflow." \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patcher-logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 7
